<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Job Harness Browser Bridge</title><link rel="stylesheet" href="ui.css"></head><body><main><h1>Job Harness Browser Bridge</h1><p>这个扩展只提供浏览器执行通道。岗位、简历、投递状态和最终提交授权仍由 Job Harness 管理。</p><form id="settings"><label>Bridge URL<input id="bridgeUrl" placeholder="https://oracle.example.ts.net:20901/internal/browser-bridge/v1" required></label><label>Agent ID<input id="agentId" required></label><label>Agent 名称<input id="agentName" required></label><label>一次性配对码<input id="pairingCode" autocomplete="off" placeholder="AB12-CD34-EF56"><small>只在首次配对/重新配对时填写；长期 Agent Token 不显示在页面中。</small></label><label class="check"><input id="enabled" type="checkbox">启用连接</label><label class="check"><input id="resumeUpload" type="checkbox">允许受控 PDF 上传（真实浏览器验证完成前保持关闭）</label><label class="check"><input id="screenshots" type="checkbox">允许截图（默认关闭）</label><div class="actions"><button type="submit">保存 / 配对并重连</button><button id="unpair" type="button">解除配对</button></div><span id="status"></span></form></main><script src="options.js"></script></body></html>
